# Local stack: SQL Server 2022 + the API. Run the React app separately with `npm run dev` in frontend/.
# The password below is for a throwaway local container only.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  api:
    build: ./backend
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ConnectionStrings__Docket: "Server=sql,1433;Database=PatentDocket;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True"
      Database__SeedDemoData: "true"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5080:8080"
