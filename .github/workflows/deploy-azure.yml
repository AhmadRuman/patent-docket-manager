name: Deploy to Azure

# Runs after infra/provision.sh has created the resources and the secrets below exist.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC login to Azure, no long-lived credentials stored in GitHub
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  api:
    name: Deploy API to App Service
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish backend/src/PatentDocket.Api -c Release -o publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

  web:
    name: Deploy React app to Static Web Apps
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
