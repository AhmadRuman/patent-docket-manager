name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  migrations:
    name: API against SQL Server
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
        ports: ["1433:1433"]
    env:
      ConnectionStrings__Docket: Server=localhost,1433;Database=PatentDocket;User Id=sa;Password=Ci_Only_Passw0rd!;TrustServerCertificate=True
      Database__SeedDemoData: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check migrations match the model
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/PatentDocket.Api
      - name: Start API (applies migrations and seeds fictional data)
        working-directory: backend/src/PatentDocket.Api
        run: |
          dotnet run -c Release --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 3; done
          curl -sf http://localhost:5080/api/dashboard | jq '{overdueCount, dueThisWeekCount, activeMatterCount}'
          curl -sf "http://localhost:5080/api/matters?search=acme" | jq -e 'length == 2'
      - if: failure()
        run: cat backend/src/PatentDocket.Api/api.log

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
